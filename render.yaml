# Render Blueprint — TODO EN RENDER (ideal para pruebas y para arrancar)
# Un solo servicio (web + workers juntos) + disco para imágenes y videos + Postgres.
# Para escalar a varios servidores usa render.escalado.yaml (necesita R2 o Supabase Storage).
databases:
  - name: gancho-db
    plan: basic-256mb
    ipAllowList: []          # solo los servicios de Render pueden conectarse
    databaseName: gancho

services:
  - type: web
    name: gancho
    runtime: node
    plan: standard            # 2 GB de memoria: ffmpeg, 4K y detector de caras lo necesitan
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /salud
    disk:
      name: gancho-datos
      mountPath: /var/data
      sizeGB: 20              # para pruebas; súbelo si suben muchos videos 4K (se borran solos a los VIDEO_RETENTION_DAYS)
    envVars:
      - key: NODE_ENV
        value: production
      - key: ROLE
        value: all
      - key: DATA_DIR
        value: /var/data
      - key: VIDEO_RETENTION_DAYS
        value: "2"
      - key: IMAGE_RESOLUTION
        value: 1K
      - key: DAILY_IMAGE_LIMIT
        value: "700"
      - key: ORG_DAILY_IMAGE_LIMIT
        value: "3000"
      - key: VIDEO_CONCURRENCY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: CALLBACK_SECRET
        generateValue: true
      - key: LINK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: gancho-db, property: connectionString }
      - key: PUBLIC_BASE_URL     # https://tu-dominio o la URL .onrender.com
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NANOBANANA_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
