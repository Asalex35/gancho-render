# /etc/nginx/sites-available/gancho  (ligar en sites-enabled). Solo escucha dentro del servidor: cloudflared llega aquí.
# Usa el map $ip_visitante de /etc/nginx/nginx.conf del ERP (IP real desde CF-Connecting-IP).
server {
  listen 127.0.0.1:8082;
  server_name portadas.erp-prismaticoos.com portadas-pruebas.erp-prismaticoos.com;

  # Videos sin Spaces: se suben en partes de 64 MB (por eso 70m). Con Spaces suben directo al bucket.
  client_max_body_size 70m;
  proxy_request_buffering off;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $ip_visitante;
    proxy_set_header X-Forwarded-For $ip_visitante;     # nunca la cadena del visitante (Gancho limita por IP)
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
  }
  # La ruta de inicio único lleva un token de un solo uso: no se escribe en el log.
  location = /sso {
    access_log off;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $ip_visitante;
    proxy_set_header X-Forwarded-For $ip_visitante;
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
  }
}
